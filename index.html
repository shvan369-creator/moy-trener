<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Мой тренер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f3f5f9; --card:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e5e9f0;
  --blue:#2563eb; --blue-soft:#e8f0fe; --green:#16a34a; --green-soft:#e7f6ec; --red:#b91c1c; --navy:#0b1b3f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 96px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:34px;line-height:1.05;margin:4px 0 2px;font-weight:800;letter-spacing:-.02em}
h1 b{color:var(--blue)}
h2{font-size:18px;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:13px}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0 12px}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width .3s}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px}
.day{background:var(--card);border-radius:12px;padding:6px 0 7px;text-align:center;border:1px solid var(--line)}
.day .dn{font-size:10px;color:var(--muted)}
.day .dd{font-size:17px;font-weight:700}
.day .dc{font-size:10px;color:var(--muted);height:13px}
.day.today{border-color:var(--blue)}
.day.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
.day.sel .dn,.day.sel .dc{color:#cbd5e1}
.day.done .dc{color:var(--green);font-weight:700}
.day.sel.done .dc{color:#86efac}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.wh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.letter{font-size:30px;font-weight:900;color:var(--blue);line-height:1}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--blue-soft);color:var(--blue);padding:3px 7px;border-radius:6px}
.tag.g{background:var(--green-soft);color:var(--green)}
.right{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.sec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.ex{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.ex:first-of-type{border-top:0}
.thumb{width:76px;height:44px;flex:none;border-radius:8px;background:#f8fafc;border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:contain}
.ex .t{font-weight:600;font-size:14px}
.ex .d{font-size:12px;color:var(--muted)}
.ex .s{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap;padding-left:6px}
.btn{display:block;width:100%;background:var(--blue);color:#fff;font-weight:700;border-radius:14px;padding:14px;text-align:center;font-size:16px;margin-top:10px}
.btn.sec2{background:var(--blue-soft);color:var(--blue)}
.btn.ghost{background:transparent;color:var(--muted);font-weight:600}
.btn.green{background:var(--green)}
.big{font-size:30px;font-weight:800}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.box{width:22px;height:22px;flex:none;border-radius:7px;border:2px solid #cbd5e1;display:flex;align-items:center;justify-content:center;margin-top:1px}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box:after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check .t{font-weight:600;font-size:14px}
.check .d{font-size:12px;color:var(--muted)}
.check .n{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
.meter{display:flex;align-items:baseline;gap:6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(8px);z-index:5}
.nav button{flex:1;padding:6px 0;font-size:11px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button.on{color:var(--blue)}
.nav svg{width:22px;height:22px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-end;z-index:20}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet img{width:100%;border-radius:12px;background:#f8fafc;border:1px solid var(--line)}
ol.steps{padding-left:20px;margin:8px 0}
ol.steps li{margin:4px 0}
.mist{color:var(--red);font-size:13px;margin-top:8px}
.kv{font-size:13px;margin-top:5px}
.note{font-size:12px;color:var(--muted);margin-top:4px}
.run{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;overflow:auto}
.run.show{display:block}
.runtop{display:flex;align-items:center;gap:10px}
.x{width:36px;height:36px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px;line-height:1}
.counter{display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0}
.counter button{width:48px;height:48px;border-radius:14px;background:var(--blue-soft);color:var(--blue);font-size:26px;font-weight:700}
.counter .v{font-size:40px;font-weight:800;min-width:70px;text-align:center}
.timer{font-size:84px;font-weight:800;text-align:center;letter-spacing:-.03em;margin:14px 0 4px;font-variant-numeric:tabular-nums}
.ring{text-align:center;color:var(--muted)}
.row{display:flex;gap:8px}
.row>*{flex:1}
input.w{width:100%;font:inherit;font-size:22px;font-weight:700;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:center}
.hist{font-size:13px;padding:7px 0;border-top:1px solid var(--line);display:flex;gap:8px}
.hist b{min-width:84px}
details summary{cursor:pointer;color:var(--blue);font-weight:600;font-size:13px;margin-top:6px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.sw{width:46px;height:28px;border-radius:14px;background:#cbd5e1;position:relative;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--green)}
.sw.on:after{left:21px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="nav" id="nav"></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="run" id="run"><div class="wrap" id="runbody"></div></div>

<script>
const DATA = {"workouts": [{"code": "A", "title": "грудь, плечи, трицепс", "day": "понедельник", "focus": "плечи и грудной отдел", "mob": [{"id": "m1", "name": "Кошка-корова", "dose": "10 медленных повторов", "steps": ["Встань на четвереньки: ладони под плечами, колени под тазом.", "На выдохе округли спину вверх, подбородок к груди, живот втяни («кошка»).", "На вдохе прогнись: грудь вперёд, взгляд вперёд-вверх («корова»).", "Двигайся медленно, как будто сгибаешь позвоночник по одному позвонку."], "mist": "двигаются только шея и поясница, а середина спины стоит; рывки.", "video": "https://www.youtube.com/results?search_query=%D0%BA%D0%BE%D1%88%D0%BA%D0%B0%20%D0%BA%D0%BE%D1%80%D0%BE%D0%B2%D0%B0%20%D1%83%D0%BF%D1%80%D0%B0%D0%B6%D0%BD%D0%B5%D0%BD%D0%B8%D0%B5"}, {"id": "m3", "name": "Выкруты с полотенцем", "dose": "10–12 повторов", "steps": ["Возьми полотенце (или резинку) широким хватом, прямые руки перед бёдрами.", "Медленно подними прямые руки над головой.", "Продолжай дугу назад, пока полотенце не окажется за спиной у поясницы.", "Верни тем же путём. Не проходит — возьмись ещё шире."], "mist": "сгибаешь локти, чтобы «пролезть»; прогибаешь поясницу.", "video": "https://www.youtube.com/results?search_query=%D0%B2%D1%8B%D0%BA%D1%80%D1%83%D1%82%D1%8B%20%D1%81%20%D0%BF%D0%BE%D0%BB%D0%BE%D1%82%D0%B5%D0%BD%D1%86%D0%B5%D0%BC%20%D0%B4%D0%BB%D1%8F%20%D0%BF%D0%BB%D0%B5%D1%87"}, {"id": "m4", "name": "Скольжения у стены", "dose": "10 повторов", "steps": ["Встань спиной к стене: пятки в 10 см, таз, лопатки и затылок прижаты.", "Руки буквой «W»: локти и тыльные стороны кистей касаются стены.", "Скользи руками вверх до буквы «Y», не отрывая их от стены.", "Медленно верни вниз."], "mist": "поясница и руки отрываются от стены; плечи поднимаются к ушам.", "video": "https://www.youtube.com/results?search_query=%D1%81%D0%BA%D0%BE%D0%BB%D1%8C%D0%B6%D0%B5%D0%BD%D0%B8%D1%8F%20%D1%83%20%D1%81%D1%82%D0%B5%D0%BD%D1%8B%20wall%20slides"}, {"id": "m2", "name": "Собака мордой вниз → кобра", "dose": "8 переходов", "steps": ["Из упора лёжа подними таз вверх: руки и спина одной линией, пятки тянутся к полу.", "Задержись на 2 вдоха.", "Плавно опусти таз к полу, выпрями руки, грудь вперёд-вверх, плечи опусти от ушей.", "Задержись на 2 вдоха и вернись в «собаку»."], "mist": "круглая спина в «собаке» (согни колени, если тянет под коленями); плечи у ушей в «кобре»; боль в пояснице — делай прогиб меньше.", "video": "https://www.youtube.com/results?search_query=%D1%81%D0%BE%D0%B1%D0%B0%D0%BA%D0%B0%20%D0%BC%D0%BE%D1%80%D0%B4%D0%BE%D0%B9%20%D0%B2%D0%BD%D0%B8%D0%B7%20%D0%BA%D0%BE%D0%B1%D1%80%D0%B0%20%D0%BF%D0%B5%D1%80%D0%B5%D1%85%D0%BE%D0%B4"}], "ex": [{"img": "a1", "name": "Отжимания с ногами на стуле", "sets": "4 × 10–15", "steps": ["Носки на сиденье стула, ладони на полу чуть шире плеч, руки прямые.", "Тело — прямая линия от пяток до головы: напряги пресс и ягодицы.", "Опускайся 3 секунды, локти уходят назад под углом ~45° к корпусу.", "Грудь почти касается пола — мощно выжми себя вверх."], "mist": "провисает или задирается таз; локти разведены в стороны под 90°; неполная амплитуда.", "note": null, "breath": "Вдох — вниз, выдох — на подъёме.", "feel": "Верх груди, передние дельты, трицепс.", "easier": "Обычные отжимания от пола.", "harder": "Рюкзак с книгами 5–10 кг на спине.", "video": "https://www.youtube.com/results?search_query=%D0%BE%D1%82%D0%B6%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D1%8F%20%D1%81%20%D0%BD%D0%BE%D0%B3%D0%B0%D0%BC%D0%B8%20%D0%BD%D0%B0%20%D0%B2%D0%BE%D0%B7%D0%B2%D1%8B%D1%88%D0%B5%D0%BD%D0%B8%D0%B8%20%D1%82%D0%B5%D1%85%D0%BD%D0%B8%D0%BA%D0%B0"}, {"img": "a2", "name": "Отжимания с паузой внизу", "sets": "3 × 12–20", "steps": ["Упор лёжа, ладони под плечами, тело прямое.", "Опускайся 3 секунды до касания грудью почти пола.", "Замри внизу на 2 секунды, не расслабляя пресс.", "Выжми себя вверх за 1 секунду."], "mist": "«падение» вниз без контроля; отдых внизу на полу.", "note": null, "breath": "Вдох — вниз, в паузе не дыши, выдох — на подъёме.", "feel": "Грудь const tg = window.Telegram && window.Telegram.WebApp;
const TARGET_K = 3150, TARGET_P = 170;
const DN = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const PLAN = {0:0, 2:1, 4:2};           // Пн→A, Ср→B, Пт→C (индекс дня недели с понедельника)

// ---------- даты ----------
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function dow(d){return (d.getDay()+6)%7}
function monday(d){const x=new Date(d);x.setDate(x.getDate()-dow(x));x.setHours(0,0,0,0);return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
const TODAY = ymd(new Date());

// ---------- хранение ----------
const KEY = "fitapp_v1";
let S = {start:null, done:{}, food:{}, weights:[], log:{}, rest:75, voice:true, updated:0};
function loadLocal(){try{const v=localStorage.getItem(KEY); if(v) Object.assign(S, JSON.parse(v));}catch(e){}}
function cloudOK(){return tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9")}
let saveT=null;
function save(){
  S.updated=Date.now();
  try{localStorage.setItem(KEY, JSON.stringify(S));}catch(e){}
  clearTimeout(saveT); saveT=setTimeout(saveCloud, 800);
}
function saveCloud(){
  if(!cloudOK()) return;
  const s=JSON.stringify(S), n=Math.ceil(s.length/3500);
  const items={}; for(let i=0;i<n;i++) items["s"+i]=s.slice(i*3500,(i+1)*3500);
  items.meta=JSON.stringify({n, updated:S.updated});
  for(const k in items){try{tg.CloudStorage.setItem(k, items[k], ()=>{});}catch(e){}}
}
function loadCloud(cb){
  if(!cloudOK()) return cb();
  try{
    tg.CloudStorage.getItem("meta",(err,m)=>{
      if(err||!m) return cb();
      let meta; try{meta=JSON.parse(m)}catch(e){return cb()}
      if(!meta.updated || meta.updated<=S.updated) return cb();
      const keys=[]; for(let i=0;i<meta.n;i++) keys.push("s"+i);
      tg.CloudStorage.getItems(keys,(e2,vals)=>{
        if(!e2&&vals){try{Object.assign(S, JSON.parse(keys.map(k=>vals[k]||"").join(""))); localStorage.setItem(KEY, JSON.stringify(S));}catch(e){}}
        cb();
      });
    });
  }catch(e){cb()}
}

// ---------- голос и звук ----------
let ruVoice=null;
function pickVoice(){if(!window.speechSynthesis) return; const v=speechSynthesis.getVoices(); ruVoice=v.find(x=>/^ru/i.test(x.lang))||null;}
if(window.speechSynthesis){pickVoice(); speechSynthesis.onvoiceschanged=pickVoice;}
function say(t){
  if(!S.voice||!window.speechSynthesis) return;
  try{speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang="ru-RU"; if(ruVoice) u.voice=ruVoice; u.rate=1.02; speechSynthesis.speak(u);}catch(e){}
}
let actx=null;
function beep(f=880,ms=140){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.25,actx.currentTime); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+ms/1000); o.start(); o.stop(actx.currentTime+ms/1000);}catch(e){}}
function haptic(t){try{tg&&tg.HapticFeedback&&(t==="ok"?tg.HapticFeedback.notificationOccurred("success"):tg.HapticFeedback.impactOccurred("light"))}catch(e){}}

// ---------- помощники ----------
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function parseSets(s){
  const m=s.match(/^(\d+)\s*×\s*(\d+)(?:–(\d+))?\s*(сек)?/);
  if(!m) return {sets:1, lo:10, hi:10, timed:false};
  return {sets:+m[1], lo:+m[2], hi:+(m[3]||m[2]), timed:!!m[4], side:/на каждую/.test(s)};
}
const START = parse(DATA.start);
function weekNo(d){return Math.floor((monday(d)-START)/(7*864e5))+1}
function wkIdx(date){if(!date) return 1; const n=weekNo(parse(date)); return n<1?0:(n-1)%4}
function adj(sets, wi){
  const ps=parseSets(sets), W=DATA.weeks[wi];
  const n=Math.max(2,Math.min(5,ps.sets+W.sets)); let lo=ps.lo, hi=ps.hi;
  if(ps.timed){ if(W.mode==="tech"){hi=lo; lo=Math.max(20,lo-15)} if(W.mode==="int"){lo+=15; hi+=15} }
  else if(W.mode==="tech"){ if(lo===hi){lo=hi=Math.max(5,lo-5)} else hi=Math.min(hi,lo+2) }
  const side=ps.side?(/руку/.test(sets)?" на каждую руку":" на каждую ногу"):"";
  return {str:`${n} × ${lo===hi?lo:lo+"–"+hi}${ps.timed?" сек":""}${side}`, ps:{sets:n,lo,hi,timed:ps.timed,side:ps.side}};
}
function cap(t){return t?t[0].toUpperCase()+t.slice(1):t}
function openLink(u){try{if(tg&&tg.openLink){tg.openLink(u);return}}catch(e){} window.open(u,"_blank")}
function foodDay(date){S.food[date]=S.food[date]||{eaten:[],p:0,k:0,sleep:false}; return S.food[date]}
function mealsFor(date){return DATA.meals[dow(parse(date))]}
function totals(date){
  const f=S.food[date]||{eaten:[],p:0,k:0}, m=mealsFor(date);
  let k=f.k||0, p=f.p||0; (f.eaten||[]).forEach(i=>{if(m.meals[i]){k+=m.meals[i].kcal; p+=m.meals[i].p}});
  return {k,p};
}
function workoutFor(date){const i=PLAN[dow(parse(date))]; return i==null?null:DATA.workouts[i]}

function exRow(e, kind, wi, idx, date){
  const img=DATA.imgs[kind==="mob"?e.id:e.img];
  const st=kind==="mob"?e.dose:adj(e.sets,wkIdx(date)).str;
  return `<button class="ex" onclick="openEx(${wi},'${kind}',${idx},'${date||""}')"><span class="thumb"><img src="${img}" alt=""></span>
    <span><div class="t">${esc(e.name)}</div><div class="d">${kind==="mob"?"мобильность":esc(e.steps[0].slice(0,60))+"…"}</div></span>
    <span class="s">${esc(st.replace(/ на каждую.*/,"/сторона"))}</span></button>`;
}
function workoutCard(w, date, showStart){
  const wi=DATA.workouts.indexOf(w), done=S.done[date]===w.code, isToday=date===TODAY;
  return `<div class="card">
    <div class="wh"><span class="letter">${w.code}</span><div><h2>${esc(w.title[0].toUpperCase()+w.title.slice(1))}</h2>
    <div class="eyebrow">${esc(w.day)} · ${w.ex.length} упр. + мобильность</div></div>
    <span class="right">${done?'<span class="tag g">сделано</span>':isToday?'<span class="tag">сегодня</span>':''}<br>~55 мин</span></div>

      h+=`<button class="btn" onclick="nextStep()">Готово, дальше ▸</button>`;
    } else if(st.ps.timed){
      h+=`<div class="card" style="text-align:center"><div class="eyebrow">Подход ${st.s+1} из ${st.ps.sets}</div><div class="big">${st.ps.lo}–${st.ps.hi} сек</div>
        <button class="btn" onclick="startWork(${st.ps.lo})">Старт ▸</button></div>`;
    } else {
      const key=st.i+"_"+st.s; if(R.reps[key]==null) R.reps[key]=st.ps.lo;
      h+=`<div class="card" style="text-align:center"><div class="eyebrow">Подход ${st.s+1} из ${st.ps.sets} · цель ${st.ps.lo}–${st.ps.hi}${st.ps.side?" на сторону":""}</div>
        <div class="counter"><button onclick="rep(-1)">−</button><span class="v">${R.reps[key]}</span><button onclick="rep(1)">+</button></div>
        <div class="sub">сколько повторов сделал</div>
        <button class="btn" onclick="setDone()">Подход сделан ✓</button></div>`;
    }
    h+=`<button class="btn ghost" onclick="nextStep(true)">Пропустить</button>`;
  }
  b.innerHTML=h;
}
function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function rep(d){const st=cur(), key=st.i+"_"+st.s; R.reps[key]=Math.max(0,(R.reps[key]||0)+d); haptic(); renderRun()}
function setDone(){haptic("ok"); nextStep(false,true)}
function nextStep(skip,rest){
  if(R.pos>=R.steps.length-1){finishRun(); return}
  R.pos++;
  if(rest && R.steps[R.pos].kind==="set"){startRest(); return}
  R.phase="do"; announce(); renderRun(); window.scrollTo(0,0);
}
function startRest(){
  R.phase="rest"; R.end=Date.now()+S.rest*1000; R.left=S.rest*1000; R.warned=false;
  say(`Отдых ${S.rest} секунд.`); renderRun();
  clearInterval(tick); tick=setInterval(tickRest,250);
}
function tickRest(){
  if(!R||R.phase!=="rest") return;
  R.left=R.end-Date.now(); const el=document.getElementById("tm"); if(el) el.textContent=fmt(R.left);
  const s=Math.ceil(R.left/1000);
  if(s===10&&!R.warned){R.warned=true; say("Десять секунд.")}
  if(s<=3&&s>0&&R.lastBeep!==s){R.lastBeep=s; beep(660)}
  if(R.left<=0) endRest();
}
function endRest(){clearInterval(tick); beep(990,300); haptic("ok"); R.phase="do"; announce(); renderRun(); window.scrollTo(0,0)}
function startWork(sec){
  R.phase="work"; R.end=Date.now()+sec*1000; R.left=sec*1000; say("Поехали!"); renderRun();
  clearInterval(tick); tick=setInterval(()=>{R.left=R.end-Date.now(); const el=document.getElementById("tm"); if(el) el.textContent=fmt(R.left);
    const s=Math.ceil(R.left/1000); if(s<=3&&s>0&&R.lastBeep!==s){R.lastBeep=s; beep(660)} if(R.left<=0) endWork();},250);
}
function endWork(){clearInterval(tick); beep(990,300); haptic("ok"); const st=cur(); R.reps[st.i+"_"+st.s]="✓"; nextStep(false,true)}
function finishRun(){
  clearInterval(tick); R.phase="finish";
  if(!R.mobOnly){
    S.done[R.date]=R.w.code;
    const sets={}; Object.entries(R.reps).forEach(([k,v])=>{const [i,s]=k.split("_").map(Number); const n=R.w.ex[i].name.slice(0,24); (sets[n]=sets[n]||[])[s]=v});
    S.log[R.date]={code:R.w.code,sets}; save();
    say("Тренировка закончена. Отличная работа!");
  } else say("Мобильность готова. Хорошей репетиции!");
  haptic("ok"); renderRun();
}
function quitRun(){
  if(R&&R.phase!=="finish"&&R.pos>0){
    const done=()=>closeRun();
    if(tg&&tg.showConfirm&&tg.isVersionAtLeast&&tg.isVersionAtLeast("6.2")) tg.showConfirm("Выйти из тренировки? Прогресс этой тренировки не сохранится.",ok=>{if(ok) done()});
    else done();
  } else closeRun();
}
function closeRun(){
  clearInterval(tick); try{speechSynthesis.cancel()}catch(e){}
  R=null; document.getElementById("run").classList.remove("show");
  if(tg&&tg.BackButton){tg.BackButton.offClick(quitRun); tg.BackButton.hide()}
  render();
}

// ---------- старт ----------
loadLocal();
if(!S.start){S.start=ymd(monday(new Date())); save();}
if(tg){try{tg.ready(); tg.expand(); tg.setHeaderColor&&tg.setHeaderColor("#f3f5f9"); tg.setBackgroundColor&&tg.setBackgroundColor("#f3f5f9");}catch(e){}}
render();
loadCloud(()=>{render()});
</script>
