name: Напоминания
on:
  schedule:
    - cron: '12 20 * * 2,3'
    - cron: '27 12 * * 0,6'
    - cron: '27 15 * * 2,4'
    - cron: '27 17 * * 0,6'
    - cron: '27 19 * * 1,3,6'
    - cron: '27 8 * * 5'
    - cron: '42 12 * * 5'
    - cron: '42 13 * * 1,3'
    - cron: '42 19 * * 2,4'
    - cron: '42 9 * * 5'
    - cron: '57 10 * * 1,3,5'
    - cron: '57 11 * * 1,3'
    - cron: '57 12 * * 2,4'
    - cron: '57 14 * * 0,6'
    - cron: '57 18 * * 5'
    - cron: '57 19 * * 5'
    - cron: '57 5 * * 1,2,3,4,5'
    - cron: '57 6 * * 0,6'
    - cron: '57 8 * * 1,2,3,4'
    - cron: '57 9 * * 0,6'
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 notify.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SCHEDULE: ${{ github.event.schedule }}
